# --- PostgreSQL --------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/gestionformation
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ----------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

# Rejeter les champs inconnus dans le body
spring.jackson.deserialization.fail-on-unknown-properties=true



# ✅ Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# --- Email (SMTP) --------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:changeme@gmail.com}
spring.mail.password=${MAIL_PASSWORD:changeme}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.mail-from=${MAIL_FROM:noreply@gestionformation.com}

