<div class="modal-form">

  <div class="modal-header">
    <h2 class="modal-title">
      {{ isReadOnly ? 'Consulter' : (isEditMode ? 'Modifier' : 'Ajouter') }} Paiement
    </h2>
    <button class="modal-close" (click)="onCancel()" type="button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="loading-container" *ngIf="isLoading">
    <mat-icon style="animation: spin 1s linear infinite; color: #023773;">sync</mat-icon>
    <p>Chargement...</p>
  </div>

  <form [formGroup]="form"
        (ngSubmit)="onSubmit()"
        *ngIf="!isLoading"
        class="form-body">

      <div class="form-field-full">
        <label class="field-label" for="montant">Montant *</label>
        <mat-form-field class="form-field-full" appearance="outline">
          <input matInput type="number"
                 formControlName="montant"
                 id="montant"
                 placeholder="Insérer montant">
          <mat-error *ngIf="isInvalid('montant')">{{ getErrorMessage('montant') }}</mat-error>
        </mat-form-field>
      </div>
      <div class="form-field-full">
        <label class="field-label" for="date">Date *</label>
        <mat-form-field class="form-field-full" appearance="outline">
          <input matInput [matDatepicker]="pickerdate"
                 formControlName="date"
                 id="date"
                 placeholder="Insérer une date">
          <mat-datepicker-toggle matIconSuffix [for]="pickerdate"></mat-datepicker-toggle>
          <mat-datepicker #pickerdate></mat-datepicker>
          <mat-error *ngIf="isInvalid('date')">{{ getErrorMessage('date') }}</mat-error>
        </mat-form-field>
      </div>
      <div class="form-field-full">
        <label class="field-label" for="modePaiement">Mode Paiement *</label>
        <mat-form-field class="form-field-full" appearance="outline">
          <mat-select formControlName="modePaiement"
                      id="modePaiement"
                      placeholder="Choisir mode paiement">
            <mat-option value="CARTE">Carte</mat-option>
            <mat-option value="ESPECES">Especes</mat-option>
            <mat-option value="VIREMENT">Virement</mat-option>
            <mat-option value="CHEQUE">Cheque</mat-option>
          </mat-select>
          <mat-error *ngIf="isInvalid('modePaiement')">{{ getErrorMessage('modePaiement') }}</mat-error>
        </mat-form-field>
      </div>
    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="onCancel()">
        Annuler
      </button>
      <button type="submit"
              class="btn-save"
              *ngIf="!isReadOnly"
              [disabled]="isLoading">
        {{ isEditMode ? 'Modifier' : 'Enregistrer' }}
      </button>
      <div *ngIf="isReadOnly" class="read-only-badge">
        <mat-icon>visibility</mat-icon>
        <span>Mode consultation</span>
      </div>
    </div>

  </form>

</div>
