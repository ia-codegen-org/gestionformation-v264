<div class="page-card">

  <!-- ─── Stat card ────────────────────────────── -->
  <div class="stat-card">
    <div class="stat-icon">
      <mat-icon>dataset</mat-icon>
    </div>
    <div class="stat-info">
      <span class="stat-count">{{ totalCount }}</span>
      <span class="stat-label">Total Formations</span>
    </div>
  </div>

  <div class="page-header">
    <h2 class="page-title">Liste des Formations</h2>
    <button class="btn-add" *ngIf="canCreate" (click)="onCreate()">
      <mat-icon>add</mat-icon>
      Ajouter
    </button>
  </div>

  <div class="loading-container" *ngIf="isLoading">
    <mat-icon style="animation: spin 1s linear infinite; color: #023773;">sync</mat-icon>
    <p>Chargement...</p>
  </div>

  <div class="mat-table-container" *ngIf="!isLoading">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>


 <ng-container matColumnDef="titre">
 <th mat-header-cell *matHeaderCellDef mat-sort-header>Titre</th>
 <td mat-cell *matCellDef="let row">{{ row.titre }}</td>
 </ng-container>

 <ng-container matColumnDef="description">
 <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
 <td mat-cell *matCellDef="let row">{{ row.description }}</td>
 </ng-container>

 <ng-container matColumnDef="dureeHeures">
 <th mat-header-cell *matHeaderCellDef mat-sort-header>Duree Heures</th>
 <td mat-cell *matCellDef="let row">{{ row.dureeHeures }}</td>
 </ng-container>

 <ng-container matColumnDef="tauxReussite">
 <th mat-header-cell *matHeaderCellDef mat-sort-header>Taux Reussite</th>
 <td mat-cell *matCellDef="let row">{{ row.tauxReussite ?? '—' }}</td>
 </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button
                  (click)="onView(row.id); $event.stopPropagation()"
                  title="Consulter" style="color: #8A92A6;">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button *ngIf="canEdit(row)"
                  (click)="onEdit(row.id); $event.stopPropagation()"
                  title="Modifier" style="color: #0D6EFD;">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button *ngIf="canAssign"
                  style="color: #3B82F6;"
                  matTooltip="Assigner Formateur"
                  (click)="onAssignFormateur(row.id); $event.stopPropagation()">
            <mat-icon>link</mat-icon>
          </button>
          <button mat-icon-button *ngIf="canAssign"
                  style="color: #EF4444;"
                  matTooltip="Retirer Formateur"
                  (click)="onUnassignFormateur(row.id); $event.stopPropagation()">
            <mat-icon>link_off</mat-icon>
          </button>
          <button mat-icon-button *ngIf="canDelete"
                  (click)="onDelete(row.id); $event.stopPropagation()"
                  title="Supprimer" style="color: #dc3545;">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td [colSpan]="displayedColumns.length" class="empty-state">
          <mat-icon style="font-size: 36px; color: #E2E8F0;">inbox</mat-icon>
          <p>Aucun Formation trouvé</p>
        </td>
      </tr>

    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]"
                   pageSize="10" showFirstLastButtons>
    </mat-paginator>
  </div>

</div>
