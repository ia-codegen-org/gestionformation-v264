<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="login-logo-icon">
        <mat-icon>lock_reset</mat-icon>
      </div>
      <h1 class="login-title">Mot de passe oublié</h1>
      <p class="login-subtitle">
        Saisissez votre email pour recevoir un lien de réinitialisation
      </p>
    </div>

    <div *ngIf="!emailSent" class="login-form">
      <div class="login-field">
        <label class="login-label" for="email">Adresse email</label>
        <mat-form-field appearance="outline" class="login-input">
          <input matInput type="email" [(ngModel)]="email"
                 id="email"
                 name="email" required email
                 #emailField="ngModel"
                 placeholder="votre@email.com"
                 (keyup.enter)="submit()">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="emailField.invalid && emailField.touched">Format d'email invalide</mat-error>
        </mat-form-field>
        <p class="field-error" *ngIf="errorMsg">{{ errorMsg }}</p>
      </div>

      <button type="button" class="login-btn"
              (click)="submit()"
              [disabled]="isLoading">
        {{ isLoading ? 'Envoi...' : 'Envoyer le lien' }}
      </button>

      <a routerLink="/login" class="forgot-link">
        ← Retour à la connexion
      </a>
    </div>

    <div class="success-message" *ngIf="emailSent">
      <div class="success-icon">
        <mat-icon>check_circle</mat-icon>
      </div>
      <p>Si un compte existe avec cet email, un lien de réinitialisation vous a été envoyé.</p>
      <a routerLink="/login" class="forgot-link">
        ← Retour à la connexion
      </a>
    </div>

  </div>
</div>
